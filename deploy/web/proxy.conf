root /usr/share/nginx/html;
client_max_body_size 32k;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
location /api/ {
    # Docker's DNS must be re-resolved after an independently recreated API.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_backend api:8000;
    proxy_pass http://$api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection '';
    proxy_buffering off;
    postpone_output 0;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
}
location /assets/ { try_files $uri =404; expires 1y; }
location / { expires -1; try_files $uri $uri/ /index.html; }
